<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>花見の丘 · 日系花海 | three.js</title>
<style>
  :root {
    --ink: #fff6ec;
    --ink-dim: rgba(255, 246, 236, 0.7);
    --pink: #ffc4d8;
    --panel: rgba(46, 32, 42, 0.34);
    --line: rgba(255, 255, 255, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e8cfa8; color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #scene:active { cursor: grabbing; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  #brand {
    position: absolute; left: 26px; top: 22px;
    letter-spacing: 0.3em; font-size: 13px; font-weight: 600;
    color: rgba(255, 250, 242, 0.95);
    text-shadow: 0 1px 12px rgba(120, 70, 70, 0.45);
  }
  #brand small {
    display: block; margin-top: 7px; letter-spacing: 0.14em;
    font-size: 10px; font-weight: 400; color: rgba(255, 250, 242, 0.62);
  }
  #hint {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    font-size: 12px; color: rgba(255, 250, 242, 0.75); letter-spacing: 0.08em;
    text-shadow: 0 1px 8px rgba(80, 40, 40, 0.7); white-space: nowrap;
  }
  #bar {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; padding: 7px 10px;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    box-shadow: 0 6px 30px rgba(80, 40, 40, 0.28);
    pointer-events: auto;
  }
  #bar button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    color: var(--ink-dim); font: inherit; font-size: 12.5px; letter-spacing: 0.05em;
    padding: 8px 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.2s ease, color 0.2s ease;
    white-space: nowrap;
  }
  #bar button:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); }
  #bar button.on { background: rgba(255, 196, 216, 0.22); color: var(--pink); }
  #bar button em {
    font-style: normal; font-size: 11px; color: var(--pink);
    background: rgba(255, 196, 216, 0.16); padding: 1px 6px; border-radius: 999px;
  }
  #bar .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
  #bar .dot { width: 6px; height: 6px; border-radius: 50%; background: #ffd3e2; box-shadow: 0 0 8px rgba(255, 200, 220, 0.9); }

  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: linear-gradient(180deg, #9cc3e4 0%, #f0d9b4 62%, #f6e3c4 100%);
    transition: opacity 0.7s ease; opacity: 1;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: rgba(255, 250, 240, 0.95);
    animation: spin 0.9s linear infinite;
  }
  #loading p {
    margin: 0; font-size: 13px; letter-spacing: 0.32em; color: rgba(255, 250, 240, 0.95);
    text-indent: 0.32em; text-shadow: 0 1px 10px rgba(120, 80, 60, 0.35);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #err {
    display: none; position: fixed; left: 16px; top: 16px; z-index: 30;
    max-width: 60vw; max-height: 60vh; overflow: auto;
    padding: 12px 16px; border-radius: 10px;
    background: rgba(60, 8, 8, 0.82); border: 1px solid rgba(255, 120, 120, 0.4);
    font: 12px/1.6 Consolas, "Courier New", monospace; color: #ffd7d7; white-space: pre-wrap;
  }
  @media (max-width: 640px) {
    #bar { bottom: 20px; gap: 0; padding: 5px 7px; }
    #bar button { padding: 7px 9px; font-size: 11.5px; }
    #brand { left: 16px; top: 16px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="brand">HANAMI no OKA<small>花見の丘 · three.js 全程序化 · 无外部素材</small></div>
    <div id="hint"></div>
    <div id="bar">
      <button data-mode="auto" title="电影感自动运镜"><span class="dot"></span>自动</button>
      <button data-mode="free" title="自由漫游：拖动鼠标 + WASD">漫游</button>
      <span class="sep"></span>
      <button data-act="wind">风 <em id="windLabel">轻风</em></button>
      <button data-act="cam">机位 <em id="camLabel">远望</em></button>
      <span class="sep"></span>
      <button data-act="shot">截图</button>
      <button data-act="fullscreen">全屏</button>
    </div>
  </div>

  <div id="loading"><div class="ring"></div><p>正在种下这片花海</p></div>
  <pre id="err"></pre>

  <script src="./vendor/three.min.js"></script>
  <script src="./src/textures.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
